name: Validate book

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: Structure, references, ledger, secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run static checks
        run: git-and-github-mastery/tools/check_all.sh

  git-tests:
    name: Git command tests (runner's Git version)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Show tool versions
        run: |
          git --version
          git lfs version || echo "git-lfs not installed"
          bash --version | head -1
      - name: Run Git verification scripts
        run: git-and-github-mastery/research/git-verification/run-all.sh
      - name: Print results (job log is the record; artifact hosts may be unreachable from some environments)
        if: always()
        run: |
          for f in git-and-github-mastery/research/git-verification/results/*/*.txt; do
            echo "=================== $f"; cat "$f"
          done
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: git-verification-results
          path: git-and-github-mastery/research/git-verification/results/

  chapter-commands:
    name: Chapter command transcripts (bash and zsh)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install zsh and Markdown renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh gnupg openssh-client
          python3 -m pip install --quiet markdown-it-py==4.2.0 python-docx==1.2.0 git-filter-repo==2.47.0 pyyaml==6.0.1
          # The recording tool runs with its own HOME, so a pip --user install is not visible to it: point the wrapper at the module's real folder.
          mkdir -p "$HOME/.local/bin"
          FR_DIR=$(python3 -c "import git_filter_repo, os; print(os.path.dirname(git_filter_repo.__file__))")
          printf '#!/bin/sh\nPYTHONPATH="%s" exec python3 -c "from git_filter_repo import main; main()" "$@"\n' "$FR_DIR" > "$HOME/.local/bin/git-filter-repo"
          chmod +x "$HOME/.local/bin/git-filter-repo"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install GitHub CLI 2.102.0 (pinned, checksum verified)
        run: |
          curl -sSL -o "$RUNNER_TEMP/gh.tgz" "https://github.com/cli/cli/releases/download/v2.102.0/gh_2.102.0_linux_amd64.tar.gz"
          echo "bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386  $RUNNER_TEMP/gh.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gh.tgz" -C "$RUNNER_TEMP"
          mkdir -p "$HOME/.local/bin"
          cp "$RUNNER_TEMP/gh_2.102.0_linux_amd64/bin/gh" "$HOME/.local/bin/gh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Tool versions
        run: |
          bash --version | head -1
          zsh --version
          ls --version | head -1
          python3 --version
          git filter-repo --version
          gpg --version | head -1
          gh --version | head -1
      - name: Re-run recorded transcripts and compare
        run: git-and-github-mastery/verification/run_all.sh

  chapter-commands-latest-git:
    name: Chapter command transcripts on Git v2.56.0 (built from source)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install build dependencies and shells
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh gnupg openssh-client build-essential gettext libssl-dev zlib1g-dev libcurl4-openssl-dev libexpat1-dev
          python3 -m pip install --quiet markdown-it-py==4.2.0 python-docx==1.2.0 git-filter-repo==2.47.0 pyyaml==6.0.1
          mkdir -p "$HOME/.local/bin"
          FR_DIR=$(python3 -c "import git_filter_repo, os; print(os.path.dirname(git_filter_repo.__file__))")
          printf '#!/bin/sh\nPYTHONPATH="%s" exec python3 -c "from git_filter_repo import main; main()" "$@"\n' "$FR_DIR" > "$HOME/.local/bin/git-filter-repo"
          chmod +x "$HOME/.local/bin/git-filter-repo"
      - name: Build Git v2.56.0 from the official source repository
        run: |
          git clone --quiet --depth 1 --branch v2.56.0 https://github.com/git/git.git "$RUNNER_TEMP/git-src"
          make -C "$RUNNER_TEMP/git-src" -j"$(nproc)" prefix="$HOME/git-2.56" NO_TCLTK=1 NO_PERL=1 NO_PYTHON=1 install >/dev/null
          # git subtree lives in contrib/ and is not installed by the main build
          make -C "$RUNNER_TEMP/git-src/contrib/subtree" prefix="$HOME/git-2.56" install >/dev/null
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/git-2.56/bin" >> "$GITHUB_PATH"
      - name: Install GitHub CLI 2.102.0 (pinned, checksum verified)
        run: |
          curl -sSL -o "$RUNNER_TEMP/gh.tgz" "https://github.com/cli/cli/releases/download/v2.102.0/gh_2.102.0_linux_amd64.tar.gz"
          echo "bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386  $RUNNER_TEMP/gh.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gh.tgz" -C "$RUNNER_TEMP"
          mkdir -p "$HOME/.local/bin"
          cp "$RUNNER_TEMP/gh_2.102.0_linux_amd64/bin/gh" "$HOME/.local/bin/gh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Tool versions
        run: |
          which git
          git --version
          git filter-repo --version
      - name: Re-run recorded transcripts and compare
        run: git-and-github-mastery/verification/run_all.sh
