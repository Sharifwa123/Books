name: Validate book

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: Structure, references, ledger, secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run static checks
        run: git-and-github-mastery/tools/check_all.sh

  git-tests:
    name: Git command tests (runner's Git version)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Show tool versions
        run: |
          git --version
          git lfs version || echo "git-lfs not installed"
          bash --version | head -1
      - name: Run Git verification scripts
        run: git-and-github-mastery/research/git-verification/run-all.sh
      - name: Print results (job log is the record; artifact hosts may be unreachable from some environments)
        if: always()
        run: |
          for f in git-and-github-mastery/research/git-verification/results/*/*.txt; do
            echo "=================== $f"; cat "$f"
          done
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: git-verification-results
          path: git-and-github-mastery/research/git-verification/results/

  chapter-commands:
    name: Chapter command transcripts (bash and zsh)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install zsh and Markdown renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh gnupg openssh-client
          python3 -m pip install --quiet markdown-it-py==4.2.0 python-docx==1.2.0 git-filter-repo==2.47.0
          # The recording tool runs with its own HOME, so a pip --user install is not visible to it: point the wrapper at the module's real folder.
          mkdir -p "$HOME/.local/bin"
          FR_DIR=$(python3 -c "import git_filter_repo, os; print(os.path.dirname(git_filter_repo.__file__))")
          printf '#!/bin/sh\nPYTHONPATH="%s" exec python3 -c "from git_filter_repo import main; main()" "$@"\n' "$FR_DIR" > "$HOME/.local/bin/git-filter-repo"
          chmod +x "$HOME/.local/bin/git-filter-repo"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Tool versions
        run: |
          bash --version | head -1
          zsh --version
          ls --version | head -1
          python3 --version
          git filter-repo --version
          gpg --version | head -1
      - name: Re-run recorded transcripts and compare
        run: git-and-github-mastery/verification/run_all.sh
